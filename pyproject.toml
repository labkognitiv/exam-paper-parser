[project]
name = "question-compactor"
version = "0.1.0"
description = "Split exam PDFs into compact, question-only PDFs and images."
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.24,<2"]

[project.scripts]
question-compactor = "question_compactor.cli:main"
paperscript = "question_compactor.cli:main"
markscheme-converter = "question_compactor.markscheme_converter:main"
mcq-converter = "question_compactor.mcq_converter:main"
syllabus-converter = "question_compactor.syllabus_converter:main"

[tool.setuptools]
packages = ["question_compactor"]

[tool.setuptools.package-dir]
question_compactor = "."
