<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physics 9702 · Question Renderer Prototype</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Student renderer · canonical question fixtures</p>
      <h1>Physics 9702 · Paper 2</h1>
    </div>
    <div class="header-actions">
      <span id="save-state" class="save-state">Responses stay in this tab</span>
      <button id="clear" class="quiet-button" type="button">Clear question</button>
    </div>
  </header>

  <nav id="question-nav" class="question-nav" aria-label="Questions"></nav>

  <main class="student-shell comparison-shell">
    <aside class="source-panel" aria-label="Original question image">
      <header class="panel-heading">
        <p>Original question</p>
        <span>Verification source</span>
      </header>
      <div class="source-image-wrap">
        <img id="source-image" alt="Original question">
      </div>
    </aside>
    <article class="student-paper">
      <header class="question-heading">
        <h2 id="question-label">Question</h2>
        <span id="question-marks"></span>
      </header>
      <div id="question-content" class="question-content"></div>
      <footer class="paper-footer">
        <button id="previous" class="paper-button" type="button">Previous</button>
        <button id="next" class="paper-button primary" type="button">Next question</button>
      </footer>
    </article>
  </main>

  <script src="paper-data.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
