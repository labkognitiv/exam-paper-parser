<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="t d"><title id="t">A horizontal chord and reflected companion point</title><desc id="d">A horizontal chord has endpoints P and Q reflected across the vertical line through centre C.</desc><rect width="520" height="320" fill="white"/><circle cx="180" cy="160" r="100" fill="none" stroke="#29213f" stroke-width="4"/><line x1="120" y1="80" x2="240" y2="80" stroke="#08756f" stroke-width="4"/><line x1="180" y1="35" x2="180" y2="285" stroke="#625674" stroke-width="2" stroke-dasharray="7 7"/><g fill="#08756f"><circle cx="120" cy="80" r="6"/><circle cx="240" cy="80" r="6"/></g><circle cx="180" cy="160" r="5" fill="#29213f"/><g font-family="Source Sans 3,Arial,sans-serif" font-size="20" fill="#302b40"><text x="99" y="72">P</text><text x="250" y="72">Q</text><text x="158" y="185">C</text><text x="194" y="278">x = x<tspan baseline-shift="sub" font-size="14">C</tspan></text></g></svg>
