<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-labelledby="t d"><title id="t">Two tangents meeting at T</title><desc id="d">A circle centred at C has symmetric contact points P and Q. Their tangents meet at T.</desc><rect width="520" height="330" fill="white"/><circle cx="170" cy="160" r="100" fill="none" stroke="#29213f" stroke-width="4"/><line x1="250" y1="100" x2="295" y2="160" stroke="#08756f" stroke-width="4"/><line x1="250" y1="220" x2="295" y2="160" stroke="#08756f" stroke-width="4"/><line x1="170" y1="160" x2="250" y2="100" stroke="#625674" stroke-width="2" stroke-dasharray="7 7"/><line x1="170" y1="160" x2="250" y2="220" stroke="#625674" stroke-width="2" stroke-dasharray="7 7"/><g fill="#29213f"><circle cx="170" cy="160" r="5"/><circle cx="295" cy="160" r="6"/></g><g fill="#08756f"><circle cx="250" cy="100" r="6"/><circle cx="250" cy="220" r="6"/></g><g font-family="Source Sans 3,Arial,sans-serif" font-size="20" fill="#302b40"><text x="148" y="185">C</text><text x="260" y="92">P</text><text x="260" y="242">Q</text><text x="305" y="155">T</text></g></svg>
