<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-labelledby="title description">
  <title id="title">Two intersections, one tangent point, and no intersection</title>
  <desc id="description">Three exact schematic panels show y equals x squared with horizontal lines y equals one, zero, and minus one. The first line cuts at x equals minus one and one, the second touches at zero, and the third misses.</desc>
  <rect width="780" height="330" fill="white"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(15 15)">
      <path d="M25 200H225M125 270V25" stroke="#625674" stroke-width="2"/>
      <path d="M45 40Q125 360 205 40" stroke="#29213f" stroke-width="4"/>
      <path d="M35 160H215" stroke="#08756f" stroke-width="4"/>
      <circle cx="85" cy="160" r="6" fill="#08756f"/>
      <circle cx="165" cy="160" r="6" fill="#08756f"/>
    </g>
    <g transform="translate(270 15)">
      <path d="M25 200H225M125 270V25" stroke="#625674" stroke-width="2"/>
      <path d="M45 40Q125 360 205 40" stroke="#29213f" stroke-width="4"/>
      <path d="M35 200H215" stroke="#08756f" stroke-width="4"/>
      <circle cx="125" cy="200" r="6" fill="#08756f"/>
    </g>
    <g transform="translate(525 15)">
      <path d="M25 200H225M125 270V25" stroke="#625674" stroke-width="2"/>
      <path d="M45 40Q125 360 205 40" stroke="#29213f" stroke-width="4"/>
      <path d="M35 240H215" stroke="#08756f" stroke-width="4"/>
    </g>
  </g>
  <g font-family="Source Sans 3,Arial,sans-serif" font-size="19" fill="#302b40" text-anchor="middle">
    <text x="140" y="315">two distinct roots</text>
    <text x="395" y="315">one repeated root</text>
    <text x="650" y="315">no real roots</text>
  </g>
</svg>
