<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t d"><title id="t">Extreme points of a circle</title><desc id="d">A circle centred at a,b with its highest, lowest, leftmost and rightmost points labelled symbolically.</desc><rect width="720" height="440" fill="#fff"/><circle cx="360" cy="220" r="130" fill="none" stroke="#493e60" stroke-width="4"/><path d="M230 220H490M360 90V350" stroke="#08756f" stroke-width="3" stroke-dasharray="8 7"/><circle cx="360" cy="220" r="5" fill="#29213f"/><g fill="#29213f" font-family="Arial,sans-serif" font-size="19"><text x="375" y="242">(a, b)</text><text x="372" y="78">(a, b + r)</text><text x="372" y="378">(a, b − r)</text><text x="78" y="227">(a − r, b)</text><text x="505" y="227">(a + r, b)</text></g></svg>
