<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="t d"><title id="t">Finding a circle centre from two points and a line</title><desc id="d">Points A and B lie on a horizontal chord. Its midpoint M is below centre C. The vertical perpendicular bisector through M meets a given line at C.</desc><rect width="720" height="450" fill="#fff"/><circle cx="360" cy="200" r="148.660687473" fill="none" stroke="#493e60" stroke-width="4"/><path d="M80 340L640 60" stroke="#766a88" stroke-width="4"/><path d="M360 35V410" stroke="#08756f" stroke-width="4"/><path d="M220 250H500" stroke="#493e60" stroke-width="3"/><circle cx="220" cy="250" r="6" fill="#29213f"/><circle cx="500" cy="250" r="6" fill="#29213f"/><circle cx="360" cy="250" r="5" fill="#29213f"/><circle cx="360" cy="200" r="6" fill="#29213f"/><path d="M360 250L380 250L380 230L360 230" fill="none" stroke="#29213f" stroke-width="3"/><g font-family="Arial,sans-serif" font-size="20" fill="#29213f"><text x="192" y="280">A</text><text x="510" y="244">B</text><text x="332" y="278">M</text><text x="374" y="195">C</text><text x="86" y="356" fill="#766a88">given line</text><text x="374" y="392" fill="#08756f">perpendicular bisector</text></g></svg>
