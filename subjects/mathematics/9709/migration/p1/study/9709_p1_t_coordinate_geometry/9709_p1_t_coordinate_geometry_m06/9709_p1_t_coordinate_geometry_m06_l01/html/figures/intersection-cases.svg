<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Three line and circle intersection cases</title><desc id="d">A secant with two crossings, a tangent with one touching point, and a line missing the circle.</desc><rect width="900" height="300" fill="#fff"/><g fill="none" stroke="#493e60" stroke-width="4"><circle cx="150" cy="125" r="80"/><circle cx="450" cy="125" r="80"/><circle cx="750" cy="125" r="80"/></g><g stroke="#08756f" stroke-width="4"><path d="M50 175L250 75"/><path d="M350 45H550"/><path d="M850 45V205"/></g><g fill="#29213f"><circle cx="78.4458247" cy="160.7770876" r="5"/><circle cx="221.5541753" cy="89.2229124" r="5"/><circle cx="450" cy="45" r="5"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><g font-size="19" fill="#29213f"><text x="150" y="235">two crossings</text><text x="450" y="235">one touch</text><text x="750" y="235">no crossing</text></g><g font-size="18" fill="#08756f"><text x="150" y="266">Δ &gt; 0</text><text x="450" y="266">Δ = 0</text><text x="750" y="266">Δ &lt; 0</text></g></g></svg>
